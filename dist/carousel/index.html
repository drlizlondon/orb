<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Interactive Carousel Card Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { 
    box-sizing: border-box; 
    margin: 0; 
    padding: 0; 
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }
  body {
    font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
    background: #EAE5D9;
    color: #1E1E2F;
    padding: 24px;
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }
  
  /* Top Controls Bar */
  .toolbar {
    max-width: 1200px;
    margin: 0 auto 30px auto;
    background: #FFFFFF;
    border: 4px solid #1E1E2F;
    border-radius: 24px;
    padding: 16px 28px;
    box-shadow: 6px 6px 0px #1E1E2F;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 16px;
  }
  .toolbar-title {
    font-family: 'Fredoka', cursive, sans-serif;
    font-size: 26px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .tabs {
    display: flex;
    gap: 10px;
  }
  .tab-btn {
    font-family: 'Fredoka', cursive, sans-serif;
    font-size: 18px;
    font-weight: 700;
    background: #F1F5F9;
    border: 3px solid #1E1E2F;
    border-radius: 999px;
    padding: 10px 22px;
    cursor: pointer;
    box-shadow: 3px 3px 0px #1E1E2F;
    transition: all 0.1s;
  }
  .tab-btn.active {
    background: #FEF08A;
    transform: translate(-1px, -1px);
    box-shadow: 4px 4px 0px #1E1E2F;
  }
  .actions {
    display: flex;
    gap: 12px;
  }
  .action-btn {
    font-size: 16px;
    font-weight: 800;
    background: #DCFCE7;
    border: 3px solid #1E1E2F;
    border-radius: 14px;
    padding: 10px 20px;
    cursor: pointer;
    box-shadow: 3px 3px 0px #1E1E2F;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .action-btn:hover {
    background: #BBF7D0;
  }
  .action-btn.secondary {
    background: #FFE4E6;
  }

  /* Instruction banner */
  .banner {
    max-width: 1200px;
    margin: 0 auto 30px auto;
    background: #FFFDF0;
    border: 3px dashed #64748B;
    border-radius: 16px;
    padding: 14px 20px;
    font-size: 15px;
    font-weight: 600;
    color: #475569;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  /* Cards Gallery */
  .gallery {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 48px;
  }

  /* Card Preview Container */
  .card-wrap {
    width: 800px;
    height: 800px;
    position: relative;
    background: #F4EFE6;
    padding: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 32px;
    border: 2px dashed #CBD5E1;
  }
  .card-container {
    width: 720px;
    height: 720px;
    border: 4.5px solid #1E1E2F;
    border-radius: 36px;
    box-shadow: 12px 12px 0px #1E1E2F;
    padding: 48px 52px;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .washi-tape {
    position: absolute;
    top: -20px;
    left: 50%;
    transform: translateX(-50%);
    width: 150px;
    height: 40px;
    border-left: 2px dashed rgba(30, 30, 47, 0.3);
    border-right: 2px dashed rgba(30, 30, 47, 0.3);
    border-radius: 4px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.06);
    z-index: 10;
  }
  .header-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 6px;
  }
  .step-label {
    font-family: 'Fredoka', cursive, sans-serif;
    font-size: 20px;
    font-weight: 700;
    color: #64748B;
  }
  .badge {
    border: 3px solid #1E1E2F;
    border-radius: 999px;
    padding: 6px 18px;
    font-size: 16px;
    font-weight: 800;
    box-shadow: 3px 3px 0px #1E1E2F;
  }
  .content {
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    margin: 20px 0;
  }
  h1 {
    font-family: 'Fredoka', cursive, sans-serif;
    line-height: 1.18;
    color: #1E1E2F;
    margin-bottom: 18px;
    outline: none;
  }
  .subtitle {
    font-size: 21px;
    line-height: 1.45;
    color: #475569;
    font-weight: 600;
    outline: none;
  }
  .body-text {
    font-size: 20px;
    line-height: 1.5;
    color: #334155;
    font-weight: 500;
    outline: none;
  }
  .rule-box {
    margin-top: 22px;
    background: #FFFFFF;
    border: 3px solid #1E1E2F;
    border-radius: 16px;
    padding: 16px 22px;
    font-size: 18px;
    font-weight: 800;
    color: #0F172A;
    box-shadow: 4px 4px 0px #1E1E2F;
    display: inline-block;
    outline: none;
  }
  .footer-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 2.5px dashed #CBD5E1;
    padding-top: 18px;
  }
  .category-tag {
    font-size: 16px;
    font-weight: 800;
    color: #64748B;
    text-transform: uppercase;
  }
  .slide-count {
    font-family: 'Fredoka', sans-serif;
    font-size: 18px;
    font-weight: 700;
    background: #1E1E2F;
    color: #FFFFFF;
    padding: 5px 14px;
    border-radius: 999px;
  }
  .dots {
    display: flex;
    gap: 6px;
  }
  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #CBD5E1;
    border: 1.5px solid #1E1E2F;
  }
  .dot.active {
    background: #FEF08A;
    width: 22px;
    border-radius: 10px;
  }

  /* Editable Highlight Effect on Focus */
  [contenteditable="true"]:hover {
    outline: 2px dashed #3B82F6;
    background: rgba(59, 130, 246, 0.04);
    border-radius: 6px;
  }
  [contenteditable="true"]:focus {
    outline: 2.5px solid #2563EB;
    background: #FFFFFF;
    border-radius: 6px;
    padding: 2px 6px;
  }

  /* PRINT STYLES FOR NATIVE PDF CAROUSEL EXPORT */
  @media print {
    * {
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
    body { 
      padding: 0; 
      background: none; 
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
    .toolbar, .banner { display: none !important; }
    .gallery { gap: 0 !important; }
    .card-wrap {
      width: 1080px !important;
      height: 1080px !important;
      border: none !important;
      padding: 0 !important;
      background: none !important;
      page-break-after: always !important;
      page-break-inside: avoid !important;
    }
    .card-container {
      width: 940px !important;
      height: 940px !important;
      border: 5px solid #1E1E2F !important;
      box-shadow: 14px 14px 0px #1E1E2F !important;
      padding: 64px 68px !important;
    }
    h1 { font-size: 46px !important; }
    .subtitle { font-size: 27px !important; }
    .body-text { font-size: 26px !important; }
    .rule-box { font-size: 22px !important; }
    [contenteditable="true"]:hover, [contenteditable="true"]:focus {
      outline: none !important;
      background: none !important;
    }
  }
</style>
</head>

function renderDeck() {
  const deck = decks[currentDeck];
  const container = document.getElementById('cards-container');
  container.innerHTML = '';

  deck.cards.forEach((card, index) => {
    const wrap = document.createElement('div');
    wrap.className = 'card-wrap';
    wrap.innerHTML = `
      <div class="card-container" style="background: ${card.bg};">
        <div class="washi-tape" style="background: ${card.tapeColor}; transform: translateX(-50%) rotate(${card.tapeRot});"></div>
        
        <div class="header-bar">
          <div class="step-label" contenteditable="true">${card.step}</div>
          <div class="badge" style="background: ${card.tagBg};" contenteditable="true">${card.tag}</div>
        </div>

        <div class="content">
          <h1 style="font-size: ${card.isCover ? '42px' : '34px'};" contenteditable="true">${card.title}</h1>
          ${card.subtitle ? `<div class="subtitle" contenteditable="true">${card.subtitle}</div>` : ''}
          ${card.body ? `<div class="body-text" contenteditable="true">${card.body}</div>` : ''}
          ${card.rule ? `<div class="rule-box" contenteditable="true">✨ ${card.rule}</div>` : ''}
        </div>

        <div class="footer-bar">
          <div class="category-tag" contenteditable="true">📌 ${deck.tag}</div>
          <div class="dots">
            ${deck.cards.map((_, i) => `<div class="dot ${i === index ? 'active' : ''}"></div>`).join('')}
          </div>
          <div class="slide-count">${index + 1} / ${deck.cards.length}</div>
        </div>
      </div>
    `;
    container.appendChild(wrap);
  });
}

function switchDeck(deckKey) {
  syncDomToState();
  currentDeck = deckKey;
  document.getElementById('tab-antislop').classList.toggle('active', deckKey === 'antislop');
  document.getElementById('tab-priorart').classList.toggle('active', deckKey === 'priorart');
  document.getElementById('tab-aicoding').classList.toggle('active', deckKey === 'aicoding');
  renderDeck();
}

function syncDomToState() {
  const container = document.getElementById('cards-container');
  const cardElements = container.querySelectorAll('.card-wrap');
  if (!decks[currentDeck]) return;
  cardElements.forEach((wrap, i) => {
    if (decks[currentDeck].cards[i]) {
      const card = decks[currentDeck].cards[i];
      const stepEl = wrap.querySelector('.step-label');
      const badgeEl = wrap.querySelector('.badge');
      const titleEl = wrap.querySelector('h1');
      const subEl = wrap.querySelector('.subtitle');
      const bodyEl = wrap.querySelector('.body-text');
      const ruleEl = wrap.querySelector('.rule-box');
      if (stepEl) card.step = stepEl.innerText.trim();
      if (badgeEl) card.tag = badgeEl.innerText.trim();
      if (titleEl) card.title = titleEl.innerText.trim();
      if (subEl) card.subtitle = subEl.innerText.trim();
      if (bodyEl) card.body = bodyEl.innerHTML;
      if (ruleEl) card.rule = ruleEl.innerText.replace(/^✨\s*/, '').trim();
    }
  });
  localStorage.setItem('carousel_decks_v2', JSON.stringify(decks));
  const statusEl = document.getElementById('save-status');
  if (statusEl) {
    statusEl.innerText = '✓ All edits saved';
    statusEl.style.color = '#16A34A';
  }
}

function manualSave() {
  syncDomToState();
  const btn = document.getElementById('save-btn');
  const statusEl = document.getElementById('save-status');
  const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  if (btn) {
    const origText = btn.innerText;
    btn.innerText = '✓ Saved!';
    btn.style.background = '#86EFAC';
    setTimeout(() => {
      btn.innerText = origText;
      btn.style.background = '#FEF08A';
    }, 1500);
  }
  if (statusEl) {
    statusEl.innerText = `✓ Manually saved at ${now}`;
    statusEl.style.color = '#16A34A';
  }
}

// Auto-save on every keystroke
document.getElementById('cards-container').addEventListener('input', () => {
  const statusEl = document.getElementById('save-status');
  if (statusEl) {
    statusEl.innerText = 'Saving...';
    statusEl.style.color = '#D97706';
  }
  syncDomToState();
});

function exportJson() {
  syncDomToState();
  const data = JSON.stringify(decks[currentDeck].cards, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${currentDeck}-cards.json`;
  a.click();
}

function resetCurrentDeck() {
  if (confirm("Reset this deck back to default text? Any custom edits on this deck will be cleared.")) {
    localStorage.removeItem('carousel_decks_v2');
    location.reload();
  }
}

// Load from localStorage on startup if present
const savedDecks = localStorage.getItem('carousel_decks_v2');
if (savedDecks) {
  try {
    const parsed = JSON.parse(savedDecks);
    // Merge saved cards
    Object.keys(parsed).forEach(k => {
      if (decks[k]) decks[k] = parsed[k];
    });
  } catch (e) {
    console.error("Failed to load saved decks", e);
  }
}

renderDeck();
</script>
</body>
</html>
